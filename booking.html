<!DOCTYPE html>
<html>
<head>
    <title>Booking - DK Tourism</title>
    <link rel="stylesheet" href="style.css">
    <script src="./booking.js" defer></script>
</head>
<body>

    <div class="navbar">
       <a href="index.html">Home</a>
       
        <a href="hotels.html">Hotels & Stays</a>
          
        <a href="booking.html">Booking</a>
        
     
    </div>

    <div class="content">
        <h1>Book Your Stay or Event</h1>
        <p>Please fill out the form below.</p>

        <form onsubmit="showThankYouMessage(); return false;">
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="text" id="phone" name="phone" required><br><br>
            
            <label for="booking_details">Item to Book :</label><br>
            <input type="text" id="booking_details" name="booking_details"><br><br>
            
            <input type="submit" value="Submit" class="button">
        </form>
    </div>


</body>
</html>
