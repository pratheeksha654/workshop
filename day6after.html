<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  table{
            border-collapse: collapse;
            display: none;
 }
  td,th{
          border: solid black 2px;
        padding: 3px 90px 3px 90px;
        text-align: center;
           margin:0 auto;
        }
    </style>
</head>
<body>
    <h1>fetching the data</h1>
    <table>
            <tr>
                <th>SI.NO</th>
                <th>Username</th>
                <th>Name</th>
                <th>Email</th>
       </tr>
        
        <tbody id="name"></tbody>
    </table>
    <script>
        const a= document.getElementById("name");

        const  b= async () => {
  const c   = await fetch("https://jsonplaceholder.typicode.com/users");
          if( c.ok) {
                const d = await c.json();
            d.forEach((el, idx) =>
                 {
                    let tr = document.createElement("tr");
                     tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td>${el.username}</td>
                        <td>${el.name}</td>
                        <td>${el.email}</td>
                    `;
                    
                   a.appendChild(tr);
                });
            } else {
                console.error("Error");
            }
        };
       b();

    </script>
</body>
</html>
